<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo de productos - Proyecto Primer Parcial UFPSO">
  <title>Mi Tienda | Componentes Web</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/tarjeta-producto.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <header class="encabezado">
    <div>
      <p class="marca">MI TIENDA</p>
      <h1>Catálogo de productos</h1>
    </div>
    <div class="carrito" aria-live="polite">
      🛒 Carrito: <span id="contador">0</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <p class="etiqueta">PROYECTO PRIMER PARCIAL</p>
      <h2>Componentización con Web Components</h2>
      <p>
        Ejemplo de una tarjeta de producto reutilizable desarrollada con
        HTML, CSS y JavaScript vanilla.
      </p>
    </section>

    <section class="catalogo" aria-label="Catálogo de productos">
      <tarjeta-producto
        imagen="https://picsum.photos/seed/audifonos/600/400"
        titulo="Audífonos Bluetooth"
        descripcion="Sonido envolvente con cancelación de ruido y 30 horas de batería."
        precio="120000">
      </tarjeta-producto>

      <tarjeta-producto
        imagen="https://picsum.photos/seed/teclado/600/400"
        titulo="Teclado Mecánico"
        descripcion="Switches azules, retroiluminación RGB y diseño compacto."
        precio="185000">
      </tarjeta-producto>

      <tarjeta-producto
        imagen="https://picsum.photos/seed/mouse/600/400"
        titulo="Mouse Inalámbrico"
        descripcion="Sensor de alta precisión, diseño ergonómico y conexión USB-C."
        precio="65000">
      </tarjeta-producto>
    </section>
  </main>

  <footer class="pie">
    <p>Proyecto Primer Parcial - UFPSO</p>
    <p>Desarrollo de Aplicaciones Web y Sistemas Operativos</p>
  </footer>
</body>
</html>
